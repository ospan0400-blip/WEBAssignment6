<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="part3.css">
    <script>
    $(function(){
      //Task 5
      let itemNumber = 2;

      $("#addItem").click(function () {
        itemNumber++;
        $("#itemList").append("<li>Item " + itemNumber + "</li>");
      });

      $("#prependItem").click(function () {
        itemNumber++;
        $("#itemList").prepend("<li>Item " + itemNumber + "</li>");
      });

      $("#removeItem").click(function () {
        $("#itemList li:last").remove();
      });

      //Task 6

      $("#changeImage").click(function () {
        const currentImage = $("#image").attr("src");
        if (currentImage.includes("pyramidforassignemtn.jpg")) {
          $("#image").attr("src", "secondspyramidforassignemtn.webp");
        } else {
          $("#image").attr("src", "pyramidforassignemtn.jpg");
        }
      });

      $("#changeLink").click(function () {
        const currentLink = $("#link").attr("href");
        if (currentLink === "https://en.wikipedia.org/wiki/Pyramid") {
          $("#link").attr("href", "https://en.wikipedia.org/wiki/Cube");
          $("#link").text("Open Wikipedia link about cubes");
        } else {
          $("#link").attr("href", "https://en.wikipedia.org/wiki/Pyramid");
          $("#link").text("Open Wikipedia link about pyramids");
        }
      }); 

      //Task 7

      $("#nameInput").on("input", function () {
        $("#nameOutput").text($(this).val() || "-");
      });

      $("#emailInput").on("input", function () {
        $("#emailOutput").text($(this).val() || "-");
      });
    });
  </script>
</head>
<body>
  <div>
    <h1>Add, prepend or remove items</h1>
    <ul id="itemList"><li>First item</li><li>Second item</li></ul>
    <button id="addItem">Add item</button>
    <button id="prependItem">Prepend item</button>
    <button id="removeItem">Remove item</button>
  </div>

  <div>
    <h1>Change image source</h1>
    <img id="image" src="pyramidforassignemtn.jpg" alt="pyramids">
    <button id="changeImage">Change image</button>
    <p><a id="link" href="https://en.wikipedia.org/wiki/Pyramid">Open this link</a></p>
    <button id="changeLink">Change links destination</button>
  </div>

  <div>
    <form id="userForm">
      <label>Name <input type="text" id="nameInput" placeholder="Enter your name here"></label>
      <label>Email <input type="email" id="emailInput" placeholder="Enter your email here"></label>
    </form>
    <h3>Live Preview</h3>
    <p>Name: <span id="nameOutput">-</span></p>
    <p>Email: <span id="emailOutput">-</span></p>
  </div>
</body>
</html>
